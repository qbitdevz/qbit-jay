version: 2

project_name: qbit-jay

# Releases go to qbitdevz/qbit-jay with the workflow GITHUB_TOKEN only. No
# personal access token exists, so the Homebrew formula and the Scoop manifest
# are generated into dist/ (skip_upload) and attached to the release by
# .github/workflows/release.yml. The maintainer commits them to the tap and
# bucket repositories (docs/qbit/RELEASING.md).
release:
  github:
    owner: qbitdevz
    name: qbit-jay
  prerelease: auto

builds:
  - main: ./cmd/qbit-jay
    binary: qbit-jay
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - cmd: sh -c 'if [ "{{ .Os }}" = "darwin" ] && command -v codesign >/dev/null 2>&1; then codesign --force --sign - "{{ .Path }}"; fi'

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - tools/cloud-sync-projects.sh
      - tools/cloud-sync-projects.ps1
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: qbitdevz
      name: homebrew-tap
    skip_upload: true
    directory: Formula
    name: qbit-jay
    homepage: "https://github.com/qbitdevz/qbit-jay"
    description: "Persistent memory for AI coding agents. Agent-agnostic, single binary, zero dependencies."
    license: "MIT"

scoops:
  - repository:
      owner: qbitdevz
      name: scoop-bucket
    skip_upload: true
    name: qbit-jay
    homepage: "https://github.com/qbitdevz/qbit-jay"
    description: "Persistent memory for AI coding agents. Agent-agnostic, single binary, zero dependencies."
    license: "MIT"
